<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>파일 이름 일괄 변경기</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="wrap">
    <h1>📁 파일 이름 일괄 변경기</h1>
    <p class="sub">내 폴더의 파일 이름을 규칙대로 <b>제자리에서</b> 바꿉니다. 적용 전 미리보기 · 되돌리기 지원.</p>

    <!-- 1) 폴더 지정 -->
    <section class="card">
      <h2>1. 폴더</h2>
      <input id="folderPath" type="text" placeholder="예: C:\Users\me\Desktop\연습폴더" />
      <small>지정한 폴더 <b>바로 아래 파일</b>만 대상입니다. 연습용 폴더로 먼저 테스트하세요.</small>
    </section>

    <!-- 2) 규칙 -->
    <section class="card">
      <h2>2. 규칙</h2>
      <div class="grid">
        <label>접두사 <input id="prefix" type="text" placeholder="여행_" /></label>
        <label>접미사 <input id="suffix" type="text" placeholder="_백업" /></label>
        <label>찾기 <input id="find" type="text" placeholder="IMG_" /></label>
        <label>바꾸기 <input id="replace" type="text" placeholder="사진_" /></label>
        <label>공백
          <select id="space">
            <option value="">그대로</option>
            <option value="underscore">_ 로</option>
            <option value="remove">제거</option>
          </select>
        </label>
        <label class="check"><input id="lowercase" type="checkbox" /> 소문자화</label>
      </div>
      <div class="numbering">
        <label class="check"><input id="numEnabled" type="checkbox" /> 순번 매기기</label>
        <label>자릿수 <input id="numDigits" type="number" value="4" min="1" max="6" style="width:60px" /></label>
        <small>순번을 켜면 <b>접두사 + 순번</b>으로 이름이 새로 만들어집니다 (원래 이름은 빠짐).</small>
      </div>
    </section>

    <!-- 3) 미리보기 + 적용 -->
    <section class="card">
      <h2>3. 미리보기 → 적용</h2>
      <div class="actions">
        <button id="previewBtn" class="btn primary">미리보기</button>
        <button id="applyBtn" class="btn apply" disabled>적용</button>
        <button id="undoBtn" class="btn ghost">되돌리기</button>
      </div>
      <p id="status" class="status"></p>
      <table id="table" hidden>
        <thead><tr><th>#</th><th>원래 이름</th><th>→</th><th>새 이름</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
