<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>할 일 체크리스트</title>
  <!-- [정] 매니페스트 + 테마색 → 홈 화면 아이콘/앱 모드 -->
  <meta name="theme-color" content="#7c3aed" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>할 일</h1>
      <span id="count" class="count"></span>
    </header>

    <form id="form" class="input-row">
      <input id="input" type="text" placeholder="할 일을 입력하세요" autocomplete="off" />
      <button type="submit" class="add">추가</button>
    </form>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty">할 일을 추가해 보세요 ✏️</p>
  </main>

  <!-- 레이어 순서대로 로드: 데이터 → 동작 → 화면 → 연결 -->
  <script src="store.js"></script>
  <script src="actions.js"></script>
  <script src="render.js"></script>
  <script src="app.js"></script>
</body>
</html>
