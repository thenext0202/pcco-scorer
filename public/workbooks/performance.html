.box{position:relative;width:100%;max-width:420px;background:#fff;border-radius:20px;padding:2.2rem 2rem 1.8rem;box-shadow:0 30px 70px -25px rgba(4,18,60,.7)}

.go:hover{background:#1747c4}
.go:disabled{opacity:.6;cursor:progress}

  <h1>AI 활용 퍼포먼스 마케팅 실습서</h1>
  <p>수강생 전용 자료입니다. 안내받은 비밀번호를 입력하세요.</p>
  <form id="f" autocomplete="off">

    <div class="row"><input id="pw" type="password" inputmode="numeric" autocomplete="current-password" autofocus required><button type="button" class="eye" id="eye" aria-pressed="false">보기</button></div>

    <div class="msg" id="msg" role="alert"></div>
  </form>
  <div class="foot">내용은 암호화되어 있으며 비밀번호 없이는 열 수 없습니다.</div>

  var $=function(i){return document.getElementById(i)},msg=$('msg'),go=$('go'),box=$('box');
  function b2u(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
  function u2b(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
  if(!(window.crypto&&crypto.subtle)){msg.textContent='이 브라우저(또는 열람 방식)에서는 암호 해제를 지원하지 않습니다. 최신 크롬·엣지·사파리에서 열어 주세요.';go.disabled=true;return}
  function open_(raw){
    return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt'])
      .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(IV)},k,b2u(DATA))})
      .then(function(buf){var html=new TextDecoder('utf-8').decode(buf);document.open();document.write(html);document.close()});
  }
  function derive(pw){
    return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits'])
      .then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',salt:b2u(SALT),iterations:ITER,hash:'SHA-256'},k,256)})

  }

  if(saved){open_(b2u(saved)).catch(function(){ls(KS,null)})}

  $('f').addEventListener('submit',function(e){
    e.preventDefault();var pw=$('pw').value.trim();if(!pw)return;
    go.disabled=true;go.textContent='확인 중…';msg.textContent='';
